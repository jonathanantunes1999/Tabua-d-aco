<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#cdbf9a"/>
      <stop offset="0.45" stop-color="#e3d3a6"/>
      <stop offset="1" stop-color="#f0e3bf"/>
    </linearGradient>
    <linearGradient id="far" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9ba686"/><stop offset="1" stop-color="#8a9873"/>
    </linearGradient>
    <linearGradient id="mid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7e8c56"/><stop offset="1" stop-color="#6c7c47"/>
    </linearGradient>
    <linearGradient id="near" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5c6c39"/><stop offset="1" stop-color="#3f4d29"/>
    </linearGradient>
    <linearGradient id="fore" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4a3d24"/><stop offset="1" stop-color="#2f2617"/>
    </linearGradient>
  </defs>

  <!-- sky -->
  <rect width="1600" height="900" fill="url(#sky)"/>
  <circle cx="1160" cy="210" r="120" fill="#f6ecca" opacity="0.55"/>

  <!-- far ridge -->
  <path d="M0,360 C260,300 520,340 780,318 C1040,296 1320,352 1600,312 L1600,520 L0,520 Z" fill="url(#far)"/>
  <!-- mid ridge with vineyard terraces -->
  <g>
    <path id="midhill" d="M0,470 C300,388 560,452 860,420 C1120,392 1360,470 1600,428 L1600,900 L0,900 Z" fill="url(#mid)"/>
    <clipPath id="clipmid"><use href="#midhill"/></clipPath>
    <g clip-path="url(#clipmid)" stroke="#5f6e3f" stroke-width="2" opacity="0.55" fill="none">
      <path d="M-20,500 C300,430 560,492 900,462 C1180,438 1420,500 1640,466"/>
      <path d="M-20,540 C300,470 560,532 900,502 C1180,478 1420,540 1640,506"/>
      <path d="M-20,584 C300,514 560,576 900,546 C1180,522 1420,584 1640,550"/>
      <path d="M-20,630 C300,560 560,622 900,592 C1180,568 1420,630 1640,596"/>
      <path d="M-20,678 C300,608 560,670 900,640 C1180,616 1420,678 1640,644"/>
    </g>
  </g>

  <!-- village cluster (white houses, terracotta roofs) on the right slope -->
  <g transform="translate(1000,470)">
    <g fill="#f2ede1" stroke="#d9d0bd" stroke-width="1">
      <rect x="20" y="20" width="34" height="26"/><rect x="60" y="30" width="30" height="24"/>
      <rect x="96" y="18" width="38" height="30"/><rect x="140" y="34" width="28" height="22"/>
      <rect x="40" y="54" width="32" height="24"/><rect x="80" y="60" width="36" height="26"/>
      <rect x="124" y="58" width="30" height="24"/><rect x="170" y="46" width="34" height="26"/>
      <rect x="200" y="60" width="30" height="24"/><rect x="10" y="86" width="34" height="24"/>
      <rect x="52" y="90" width="34" height="26"/><rect x="96" y="92" width="40" height="26"/>
      <rect x="146" y="86" width="32" height="26"/><rect x="188" y="92" width="34" height="24"/>
    </g>
    <g fill="#bd6338">
      <polygon points="20,20 37,10 54,20"/><polygon points="60,30 75,21 90,30"/>
      <polygon points="96,18 115,7 134,18"/><polygon points="140,34 154,25 168,34"/>
      <polygon points="40,54 56,44 72,54"/><polygon points="80,60 98,50 116,60"/>
      <polygon points="124,58 139,49 154,58"/><polygon points="170,46 187,36 204,46"/>
      <polygon points="200,60 215,51 230,60"/><polygon points="10,86 27,76 44,86"/>
      <polygon points="52,90 69,80 86,90"/><polygon points="96,92 116,81 136,92"/>
      <polygon points="146,86 162,76 178,86"/><polygon points="188,92 205,82 222,92"/>
    </g>
    <!-- little church tower -->
    <rect x="108" y="-6" width="16" height="30" fill="#f2ede1" stroke="#d9d0bd"/>
    <polygon points="108,-6 116,-20 124,-6" fill="#a9552f"/>
  </g>

  <!-- near ridge -->
  <path d="M0,640 C280,560 560,624 880,598 C1160,576 1380,636 1600,604 L1600,900 L0,900 Z" fill="url(#near)"/>
  <!-- foreground -->
  <path d="M0,770 C320,700 620,760 960,742 C1240,728 1420,772 1600,752 L1600,900 L0,900 Z" fill="url(#fore)"/>
</svg>
